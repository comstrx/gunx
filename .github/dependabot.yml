version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'global(deps)'

  - package-ecosystem: cargo
    directory: /engine/rust
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'rust(deps)'

  - package-ecosystem: gomod
    directory: /engine/go
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'go(deps)'

  - package-ecosystem: uv
    directory: /engine/python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'python(deps)'

  - package-ecosystem: bun
