    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'bun(deps)'

  - package-ecosystem: uv
    directory: /product/apex/api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'apex-api(deps)'

  - package-ecosystem: bun
    directory: /product/apex/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'apex-web(deps)'

  - package-ecosystem: bun
    directory: /product/apex/mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'apex-mobile(deps)'

  - package-ecosystem: bun
    directory: /product/apex/desktop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'apex-desktop(deps)'
