rust:
  - changed-files:
      - any-glob-to-any-file: ['engine/rust/**']

python:
  - changed-files:
      - any-glob-to-any-file: ['engine/python/**']

go:
  - changed-files:
      - any-glob-to-any-file: ['engine/go/**']

bun:
  - changed-files:
      - any-glob-to-any-file: ['engine/bun/**']

infra:
  - changed-files:
      - any-glob-to-any-file: ['engine/infra/**']

api:
  - changed-files:
      - any-glob-to-any-file: ['product/*/api/**']

web:
  - changed-files:
      - any-glob-to-any-file: ['product/*/web/**']

mobile:
  - changed-files:
      - any-glob-to-any-file: ['product/*/mobile/**']

desktop:
  - changed-files:
      - any-glob-to-any-file: ['product/*/desktop/**']

tutor:
  - changed-files:
      - any-glob-to-any-file: ['tutor/**']

global:
  - changed-files:
      - any-glob-to-any-file: ['*', '.*', '.github/**']

ci:
  - changed-files:
      - any-glob-to-any-file:
          ['.github/workflows/**', '.github/dependabot.yml', '.zizmor.yml', 'engine/infra/src/module/gate/**']

deps:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Cargo.toml'
          - '**/Cargo.lock'
          - '**/pyproject.toml'
          - '**/uv.lock'
          - '**/package.json'
          - '**/bun.lock'
          - '**/go.mod'
          - '**/go.sum'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'LICENSE'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'SECURITY.md'
          - '.gitleaks.toml'
          - '.trivy.yml'
          - '.syft.yml'
          - '.zizmor.yml'
