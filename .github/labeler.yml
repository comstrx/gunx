rust:
  - changed-files:
      - any-glob-to-any-file: ['engine/rust/**']

go:
  - changed-files:
      - any-glob-to-any-file: ['engine/go/**']

python:
  - changed-files:
      - any-glob-to-any-file: ['engine/python/**']

typescript:
  - changed-files:
      - any-glob-to-any-file: ['engine/typescript/**']

bash:
  - changed-files:
      - any-glob-to-any-file: ['engine/bash/**']

api:
  - changed-files:
      - any-glob-to-any-file: ['product/*/api/**']

web:
  - changed-files:
      - any-glob-to-any-file: ['product/*/web/**']

mobile:
  - changed-files:
      - any-glob-to-any-file: ['product/*/mobile/**']

tutor:
  - changed-files:
      - any-glob-to-any-file: ['tutor/**']

root:
  - changed-files:
      - any-glob-to-any-file: ['*', '.*', '.github/**']

ci:
  - changed-files:
      - any-glob-to-any-file:
          ['.github/workflows/**', '.github/dependabot.yml', '.zizmor.yml', 'engine/bash/src/module/gate/**']

deps:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Cargo.toml'
          - '**/Cargo.lock'
          - '**/go.mod'
          - '**/go.sum'
          - '**/pyproject.toml'
          - '**/uv.lock'
          - '**/package.json'
          - '**/bunfig.toml'
          - '**/bun.lock'
          - '**/bash.toml'
          - '**/infra.toml'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'LICENSE'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'SECURITY.md'
          - '.gitleaks.toml'
          - '.trivy.yml'
          - '.syft.yml'
          - '.zizmor.yml'
