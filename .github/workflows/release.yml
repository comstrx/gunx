name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    with:
      all: true

  sync:
    needs: ci

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go/go.work
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: engine/bun/package.json
          no-cache: true

      - uses: $/engine/infra/src/module/gate/template

      - run: infra sync --gates --timeout 1800
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_CONFIG_NAME: ${{ vars.GIT_CONFIG_NAME }}
          GIT_CONFIG_EMAIL: ${{ vars.GIT_CONFIG_EMAIL }}
