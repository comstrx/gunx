name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    with:
      all: true

  sync:
    needs: ci

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: $/engine/bash/src/module/gate/template

      - run: gunx extract --push --tag "${GITHUB_REF_NAME}" --timeout 1800

        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_CONFIG_NAME: ${{ vars.GIT_CONFIG_NAME }}
          GIT_CONFIG_EMAIL: ${{ vars.GIT_CONFIG_EMAIL }}
