name: ci

on:
  push:
    branches: [main]

  pull_request:

  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
      type:
        type: string
        default: default
      timeout:
        type: number
        default: 1800

  workflow_dispatch:
    inputs:
      all:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.type || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        path:
          - engine/rust
          - engine/python
          - engine/go
          - engine/bun
          - engine/bash
          - product/apex/api
          - product/apex/web
          - product/apex/mobile
          - product/apex/desktop
          - .

        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (inputs.type || 'default') == 'default' && 180 || 360 }}

    env:
      CI_PATH: ${{ matrix.path }}
      CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_CHANGED: ${{ !inputs.all && 'true' || '' }}
      CI_TYPE: ${{ inputs.type || 'default' }}
      CI_TIMEOUT: ${{ inputs.timeout || 1800 }}
      CI_PASS: ${{ (inputs.type || 'default') != 'default' && 'true' || '' }}

    steps:
      - uses: $/engine/bash/src/module/gate/template
        with:
          path: ${{ matrix.path }}

      - run: gunx gate --path "${CI_PATH}" --type "${CI_TYPE}" --timeout "${CI_TIMEOUT}" ${CI_CHANGED:+--only-changed} ${CI_PASS:+--pass}
