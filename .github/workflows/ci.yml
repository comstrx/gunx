name: ci

on:
  push:
    branches: [main]
  pull_request:

  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
      type:
        type: string
        default: default
      timeout:
        type: number
        default: 1800

  workflow_dispatch:
    inputs:
      all:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.type || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        part: [rust, python, go, bun, infra, api, web, mobile, desktop, tutor, root]
        os: [ubuntu-latest]

        include:
          - part: infra
            os: macos-latest
          - part: root
            os: macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (inputs.type || 'default') == 'default' && 180 || 360 }}

    env:
      CI_PART: ${{ matrix.part }}
      CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_ALL: ${{ inputs.all && 'true' || 'false' }}
      CI_TYPE: ${{ inputs.type || 'default' }}
      CI_TIMEOUT: ${{ inputs.timeout || 1800 }}
      CI_PASS: ${{ (inputs.type || 'default') != 'default' && 'true' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cargo-bins/cargo-binstall@23ee8ab6b7397851bc11705bcdf46f2519ea0285 # v1.9.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go/go.work
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: engine/bun/package.json

      - uses: $/engine/infra/src/module/gate/template

      - run: infra ci --part "${CI_PART}" --type "${CI_TYPE}" --timeout "${CI_TIMEOUT}" ${CI_PASS:+--pass}
