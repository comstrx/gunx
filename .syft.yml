log:
  quiet: false
  level: 'warn'
  verbosity: 0

check-for-app-update: false

format:
  pretty: false
  json:
    pretty: false
    legacy: false

  spdx-json:
    pretty: false

  cyclonedx-json:
    pretty: false

  cyclonedx-xml:
    pretty: false

scope: 'squashed'
parallelism: 0

relationships:
  package-file-ownership: true
  package-file-ownership-overlap: true

compliance:
  missing-name: 'keep'
  missing-version: 'keep'

enrich: []

unknowns:
  remove-when-packages-defined: false
  executables-without-packages: true
  unexpanded-archives: true

exclude:
  - '**/.git'
  - '**/.claude'
  - '**/.codex'
  - '**/.agents'
  - '**/.infra'
  - '**/.idea'
  - '**/.vscode'
  - '**/.fleet'
  - '**/.zed'
  - '**/.stage'
  - '**/.cache'
  - '**/node_modules'
  - '**/.bun'
  - '**/.hutch'
  - '**/.pnpm-store'
  - '**/.npm'
  - '**/.yarn'
  - '**/.turbo'
  - '**/.vercel'
  - '**/.parcel-cache'
  - '**/.next'
  - '**/.nuxt'
  - '**/.output'
  - '**/.vite'
  - '**/_generated'
  - '**/generated'
  - '**/.expo'
  - '**/web-build'
  - '**/android'
  - '**/ios'
  - '**/Pods'
  - '**/.gradle'
  - '**/vendor'
  - '**/.venv'
  - '**/__pycache__'
  - '**/.pytest_cache'
  - '**/.mypy_cache'
  - '**/.ruff_cache'
  - '**/.hypothesis'
  - '**/.tox'
  - '**/.nox'
  - '**/wheels'
  - '**/.eggs'
  - '**/target'
  - '**/.infra'
  - '**/fuzz/corpus'
  - '**/fuzz/artifacts'
  - '**/criterion'
  - '**/.benchmarks'
  - '**/dist'
  - '**/build'
  - '**/out'
  - '**/artifacts'
  - '**/coverage'
  - '**/htmlcov'
  - '**/.nyc_output'
  - '**/test-results'
  - '**/blob-report'
  - '**/playwright-report'
  - '**/world/data'

package:
  search-indexed-archives: true
  search-unindexed-archives: false
  exclude-binary-overlap-by-ownership: true

license:
  content: 'unknown'
  coverage: 75

file:
  metadata:
    selection: 'owned-by-package'
    digests:
      - 'sha256'
  content:
    skip-files-above-size: 256000

source:
  base-path: '.'
  file:
    digests:
      - 'SHA-256'

registry:
  insecure-skip-tls-verify: false
  insecure-use-http: false
  ca-cert: ''
  auth: []
