name: infra
description: Ready a runner for the gates, the checkout, the toolchains it needs and the command on PATH

inputs:
  path:
    description: The directories the job works on, a comma list; the whole checkout by default
    default: .

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - id: needs
      run: bash "${GITHUB_ACTION_PATH}/../../../main.sh" toolchains --path "${GATE_PATH}" >> "${GITHUB_OUTPUT}"
      shell: bash
      env:
        GATE_PATH: ${{ inputs.path }}

    - uses: cargo-bins/cargo-binstall@23ee8ab6b7397851bc11705bcdf46f2519ea0285 # v1.9.0
      if: steps.needs.outputs.rust == 'true'

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      if: steps.needs.outputs.python == 'true'
      with:
        enable-cache: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.needs.outputs.go == 'true'
      with:
        go-version-file: ${{ steps.needs.outputs.go-file }}
        cache: false

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: steps.needs.outputs.bun == 'true'
      with:
        bun-version-file: ${{ steps.needs.outputs.bun-file }}
        no-cache: true

    - run: bash "${GITHUB_ACTION_PATH}/../../../main.sh" self install --into "${RUNNER_TEMP}/bin"
      shell: bash
