taplo_linux_x86_64 = "https://github.com/tamasfe/taplo/releases/download/{version}/taplo-linux-x86_64.gz"
taplo_linux_aarch64 = "https://github.com/tamasfe/taplo/releases/download/{version}/taplo-linux-aarch64.gz"
taplo_darwin_x86_64 = "https://github.com/tamasfe/taplo/releases/download/{version}/taplo-darwin-x86_64.gz"
taplo_darwin_aarch64 = "https://github.com/tamasfe/taplo/releases/download/{version}/taplo-darwin-aarch64.gz"

