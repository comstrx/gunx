[meta]
name = "infra"
version = "0.1.0"
description = "The general engine of the work: framework, gates, extraction, mirrors, infrastructure"
license = "Apache-2.0"
readme = "README.md"
authors = ["comstrx"]

[paths]
entrypoint = "src/main.sh"
source = "src"
build = "target"
cache = ".infra"
tests = "tests"
benches = "benches"
fuzz = "fuzz"

[requires]
runtime = "bash curl tar xz gzip git"

[tools]
shellcheck = { version = "0.11.0", binary = "shellcheck-v{version}/shellcheck", severity = "style", excludes = "SC1090,SC1091" }
typos = { version = "1.52.0", binary = "./typos" }
rust = { nightly = "2026-10-08" }
bash = "5.2"
gitleaks = "8.30.1"
trivy = "0.76.2"
syft = "1.56.0"
zizmor = "1.32.0"
taplo = "0.10.0"
golangci = "2.15.0"
govulncheck = "1.9.0"
prettier = "3.9.10"

[deps]
rustx = { type = "engine", path = "engine/rust", repo = "comstrx/rustx" }
pyx = { type = "engine", path = "engine/python", repo = "comstrx/pyx" }
gox = { type = "engine", path = "engine/go", repo = "comstrx/gox" }
bunx = { type = "engine", path = "engine/bun", repo = "comstrx/bunx" }
infrax = { type = "engine", path = "engine/infra", repo = "comstrx/infrax" }
apix = { type = "fragment", path = "product/apex/api", repo = "comstrx/apix", deps = [
    { name = "engine", repo = "comstrx/pyx" },
] }
webx = { type = "fragment", path = "product/apex/web", repo = "comstrx/webx", deps = [
    { name = "engine", repo = "comstrx/bunx" },
] }
mobilex = { type = "fragment", path = "product/apex/mobile", repo = "comstrx/mobilex", deps = [
    { name = "engine", repo = "comstrx/bunx" },
] }
deskx = { type = "fragment", path = "product/apex/desktop", repo = "comstrx/deskx", deps = [
    { name = "engine", repo = "comstrx/bunx" },
] }
skillx = { type = "tutor", path = "tutor", repo = "comstrx/skillx" }

[deploy]
stack = "native"

[packages]
xz = { apt = "xz-utils" }

[archive]
shellcheck_linux_x86_64 = "https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.linux.x86_64.tar.xz"
shellcheck_linux_aarch64 = "https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.linux.aarch64.tar.xz"
shellcheck_darwin_x86_64 = "https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.darwin.x86_64.tar.xz"
shellcheck_darwin_aarch64 = "https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.darwin.aarch64.tar.xz"
gitleaks_linux_x86_64 = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_linux_x64.tar.gz"
gitleaks_linux_aarch64 = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_linux_arm64.tar.gz"
gitleaks_darwin_x86_64 = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_darwin_x64.tar.gz"
gitleaks_darwin_aarch64 = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_darwin_arm64.tar.gz"
trivy_linux_x86_64 = "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-64bit.tar.gz"
trivy_linux_aarch64 = "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-ARM64.tar.gz"
trivy_darwin_x86_64 = "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_macOS-64bit.tar.gz"
trivy_darwin_aarch64 = "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_macOS-ARM64.tar.gz"
syft_linux_x86_64 = "https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_linux_amd64.tar.gz"
syft_linux_aarch64 = "https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_linux_arm64.tar.gz"
syft_darwin_x86_64 = "https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_darwin_amd64.tar.gz"
