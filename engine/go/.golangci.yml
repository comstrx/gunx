version: '2'

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: all
  disable: [exhaustruct, gomodguard, gomodguard_v2, whitespace, wsl, wsl_v5]

  settings:
    depguard:
      rules:
        engine:
          files: ['$all']
          allow: ['$gostd', 'engine']

    testpackage:
      allow-packages: [tests, benches, fuzz]

    varnamelen:
      min-name-length: 2
      ignore-names: [b, f, t]

  exclusions:
    generated: lax
