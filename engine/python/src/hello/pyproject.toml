[project]
name = "engine-hello"
description = "The first domain: one verb that proves the workspace."
requires-python = ">=3.15"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
