[project]
name = "engine-broker"
description = "Message brokers: memory and RabbitMQ with confirms, acks, prefetch and batches"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-string",
    "engine-thread",
    "aiokafka",
    "aiormq",
    "pamqp",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
