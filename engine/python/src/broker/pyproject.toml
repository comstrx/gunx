[project]
name = "engine-broker"
description = "Message brokers: memory and RabbitMQ with confirms, acks, prefetch and batches"
dynamic = ["version"]
dependencies = [
    "engine-adapter",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-string",
    "engine-thread",
    "aiokafka",
    "aiormq",
    "pamqp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
