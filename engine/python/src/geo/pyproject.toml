[project]
name = "engine-geo"
description = "Geography: distance, bearing, geohash, bounds, provider geocoding"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-adapter", "engine-error", "engine-net", "engine-number"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
