[project]
name = "engine-fake"
description = "Realistic Arabic and English fake data for seeders and tests"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-date", "engine-error", "engine-number", "engine-rand", "engine-string"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
