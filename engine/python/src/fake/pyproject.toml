[project]
name = "engine-fake"
description = "Realistic Arabic and English fake data for seeders and tests"
dynamic = ["version"]
dependencies = ["engine-date", "engine-error", "engine-number", "engine-rand", "engine-string"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
