[project]
name = "engine-domain"
description = "Custom domains: DNS verification, provider adapters, TLS readiness"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-error",
    "engine-log",
    "engine-net",
    "engine-parse",
    "engine-rand",
    "engine-string",
    "dnspython",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
