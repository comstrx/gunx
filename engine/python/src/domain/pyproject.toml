[project]
name = "engine-domain"
description = "Custom domains: DNS verification, provider adapters, TLS readiness"
dynamic = ["version"]
dependencies = [
    "engine-adapter",
    "engine-error",
    "engine-log",
    "engine-net",
    "engine-parse",
    "engine-rand",
    "engine-string",
    "dnspython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
