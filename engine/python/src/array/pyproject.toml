[project]
name = "engine-array"
description = "Sequences: shapes, queries, aggregates, pages, native sets"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-func", "engine-json", "engine-string", "pyroaring"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
