[project]
name = "engine-array"
description = "Sequences: shapes, queries, aggregates, pages, native sets"
dynamic = ["version"]
dependencies = ["engine-error", "engine-func", "engine-json", "engine-string", "pyroaring"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
