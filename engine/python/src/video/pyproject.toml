[project]
name = "engine-video"
description = "Video: one DSL over local FFmpeg and Cloudflare Stream, HLS and playback"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-ai",
    "engine-error",
    "engine-fs",
    "engine-log",
    "engine-net",
    "engine-rand",
    "engine-storage",
    "engine-stream",
    "engine-thread",
    "av",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
