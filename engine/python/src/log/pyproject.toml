[project]
name = "engine-log"
description = "Structured logs with redaction, correlation, spans and test taps"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-context", "engine-error", "structlog"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
