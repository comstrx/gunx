[project]
name = "engine-log"
description = "Structured logs with redaction, correlation, spans and test taps"
dynamic = ["version"]
dependencies = ["engine-context", "engine-error", "structlog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
