[project]
name = "engine-net"
description = "Outbound HTTP: SSRF-safe egress, bounded bodies, retries, breakers, Remote"
dynamic = ["version"]
dependencies = [
    "engine-error",
    "engine-fs",
    "engine-func",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-string",
    "engine-thread",
    "aiohttp",
    "yarl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
