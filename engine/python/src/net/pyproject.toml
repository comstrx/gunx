[project]
name = "engine-net"
description = "Outbound HTTP: SSRF-safe egress, bounded bodies, retries, breakers, Remote"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-context",
    "engine-error",
    "engine-fs",
    "engine-func",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-string",
    "engine-thread",
    "aiohttp",
    "yarl",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
