[project]
name = "engine-func"
description = "Retries, breakers, memo, batching, callable metadata and the native core picker"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-log", "engine-rand", "engine-thread"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
