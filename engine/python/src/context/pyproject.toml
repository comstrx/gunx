[project]
name = "engine-context"
description = "Request-scoped facts and deferred work carried by contextvars"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
