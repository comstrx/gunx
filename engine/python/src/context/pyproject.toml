[project]
name = "engine-context"
description = "Request-scoped facts and deferred work carried by contextvars"
dynamic = ["version"]
dependencies = ["engine-error"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
