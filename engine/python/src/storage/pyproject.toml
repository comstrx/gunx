[project]
name = "engine-storage"
description = "Storage: one disk DSL over local folders, S3 and Google Drive, with policies"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-error",
    "engine-fs",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-rand",
    "engine-string",
    "obstore",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
