[project]
name = "engine-parse"
description = "Boundary parsing: scalars, durations, urls, identities, headers, toml"
dynamic = ["version"]
dependencies = ["engine-error", "engine-string"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
