[project]
name = "engine-number"
description = "Numbers and money: Decimal, minor units, currencies, words, roman"
dynamic = ["version"]
dependencies = ["engine-error", "engine-string"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
