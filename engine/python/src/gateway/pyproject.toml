[project]
name = "engine-gateway"
description = "Payments: one normalized charge, refund and webhook over provider adapters"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-crypto",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-number",
    "engine-rand",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
