[project]
name = "engine-rand"
description = "Randomness: tokens, codes, uuid7, ulid, seeded samples"
dynamic = ["version"]
dependencies = ["engine-error"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
