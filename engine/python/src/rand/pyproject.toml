[project]
name = "engine-rand"
description = "Randomness: tokens, codes, uuid7, ulid, seeded samples"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
