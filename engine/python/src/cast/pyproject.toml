[project]
name = "engine-cast"
description = "Explicit bounded value conversions and exact monetary boundaries."
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-array", "engine-error", "engine-json", "engine-number", "engine-string"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
