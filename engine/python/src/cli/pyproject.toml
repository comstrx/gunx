[project]
name = "engine-cli"
description = "Command lines: groups, arguments, flags, examples and the manual"
dynamic = ["version"]
dependencies = [
    "engine-error",
    "engine-log",
    "engine-parse",
    "engine-string",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
