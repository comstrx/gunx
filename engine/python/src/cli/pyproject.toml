[project]
name = "engine-cli"
description = "Command lines: groups, arguments, flags, examples and the manual"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-log", "engine-parse", "engine-string"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
