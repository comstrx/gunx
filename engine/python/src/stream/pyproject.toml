[project]
name = "engine-stream"
description = "Byte streams: ranges, pacing, pipes, tees, HLS/DASH playlists, resumable uploads"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-date", "engine-error", "engine-fs", "engine-json", "engine-thread"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
