[project]
name = "engine-test"
description = "The stage: the reference application, provisioning, a client and the bench"
dynamic = ["version"]
dependencies = [
    "engine-broker",
    "engine-cache",
    "engine-config",
    "engine-crypto",
    "engine-database",
    "engine-error",
    "engine-health",
    "engine-http",
    "engine-json",
    "engine-log",
    "engine-metric",
    "engine-net",
    "engine-rand",
    "engine-token",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
