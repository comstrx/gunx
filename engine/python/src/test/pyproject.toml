[project]
name = "engine-test"
description = "The stage: the reference application, provisioning, a client and the bench"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-broker",
    "engine-cache",
    "engine-config",
    "engine-crypto",
    "engine-database",
    "engine-error",
    "engine-health",
    "engine-http",
    "engine-json",
    "engine-log",
    "engine-metric",
    "engine-net",
    "engine-rand",
    "engine-token",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
