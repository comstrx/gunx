[project]
name = "engine-thread"
description = "Parallelism: one DSL over tasks, threads, processes, interpreters and Ray"
dynamic = ["version"]
dependencies = ["engine-error", "engine-log"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
