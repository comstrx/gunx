[project]
name = "engine-thread"
description = "Parallelism: one DSL over tasks, threads, processes, interpreters and Ray"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-log"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
