[project]
name = "engine-string"
description = "Text: fluent chains, search, folding, slugs, cases, inflection, scripts"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-func", "rapidfuzz", "stringzilla"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
