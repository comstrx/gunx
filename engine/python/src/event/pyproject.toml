[project]
name = "engine-event"
description = "Domain events: dispatch, listen, publish through the broker, durable, idempotent"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-broker",
    "engine-context",
    "engine-database",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-queue",
    "engine-rand",
    "engine-string",
    "engine-thread",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
