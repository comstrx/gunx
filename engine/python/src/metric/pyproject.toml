[project]
name = "engine-metric"
description = "Counters, gauges and histograms exposed as Prometheus text"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-log"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
