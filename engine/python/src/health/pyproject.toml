[project]
name = "engine-health"
description = "Liveness and readiness probes gathered from every domain"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-json", "engine-log", "engine-thread"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
