[project]
name = "engine-database"
description = "One SQL door over postgres, sqlite, mysql, clickhouse and mongo documents"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-date",
    "engine-error",
    "engine-health",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-rand",
    "engine-thread",
    "engine-validate",
    "apsw",
    "asyncmy",
    "asyncpg",
    "clickhouse-connect[async]",
    "pymongo",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
