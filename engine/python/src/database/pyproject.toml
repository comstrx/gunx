[project]
name = "engine-database"
description = "One SQL door over postgres, sqlite, mysql, clickhouse and mongo documents"
dynamic = ["version"]
dependencies = [
    "engine-adapter",
    "engine-date",
    "engine-error",
    "engine-health",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-rand",
    "engine-thread",
    "engine-validate",
    "apsw",
    "asyncmy",
    "asyncpg",
    "clickhouse-connect[async]",
    "pymongo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
