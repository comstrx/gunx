[project]
name = "engine-json"
description = "Fast JSON values on orjson: encode, decode, walks, merges, prunes"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "orjson"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
