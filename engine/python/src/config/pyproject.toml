[project]
name = "engine-config"
description = "Settings groups bound to the environment, validated at boot, redacted"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-json", "engine-log", "engine-parse", "engine-validate"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
