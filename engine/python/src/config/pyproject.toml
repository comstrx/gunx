[project]
name = "engine-config"
description = "Settings groups bound to the environment, validated at boot, redacted"
dynamic = ["version"]
dependencies = ["engine-error", "engine-json", "engine-log", "engine-parse", "engine-validate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
