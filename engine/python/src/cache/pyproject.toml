[project]
name = "engine-cache"
description = "Memory and Redis caches: remember, tags, locks, rate hits, a pub/sub channel"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-rand",
    "engine-thread",
    "cachebox",
    "hiredis",
    "redis",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
