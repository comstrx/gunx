[project]
name = "engine-ai"
description = "Models routed by task: chat, complete, embed over provider adapters"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-cache",
    "engine-crypto",
    "engine-error",
    "engine-fs",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-rand",
    "engine-string",
    "engine-thread",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
