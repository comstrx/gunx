[project]
name = "engine-search"
description = "Full text: one door over memory, postgres, elasticsearch, meilisearch and vespa"
dynamic = ["version"]
dependencies = [
    "engine-adapter",
    "engine-database",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-string",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
