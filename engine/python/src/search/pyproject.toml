[project]
name = "engine-search"
description = "Full text: one door over memory, postgres, elasticsearch, meilisearch and vespa"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-database",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-string",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
