[project]
name = "engine-auth"
description = "Actors, abilities, roles, scopes, OTP codes and the guards over them"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-cache",
    "engine-crypto",
    "engine-context",
    "engine-date",
    "engine-error",
    "engine-http",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-string",
    "engine-token",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
