[project]
name = "engine-auth"
description = "Actors, abilities, roles, scopes, OTP codes and the guards over them"
dynamic = ["version"]
dependencies = [
    "engine-cache",
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-http",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-string",
    "engine-token",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
