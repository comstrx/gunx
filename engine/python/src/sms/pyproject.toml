[project]
name = "engine-sms"
description = "SMS and WhatsApp: one Text, adapters for log and HTTP providers"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-error",
    "engine-log",
    "engine-net",
    "engine-parse",
    "engine-rand",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
