[project]
name = "engine-validate"
description = "Typed shapes on msgspec and the rulebook: decode once at the boundary"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-date", "engine-error", "engine-json", "engine-number", "engine-parse", "msgspec"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
