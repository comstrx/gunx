[project]
name = "engine-validate"
description = "Typed shapes on msgspec and the rulebook: decode once at the boundary"
dynamic = ["version"]
dependencies = ["engine-date", "engine-error", "engine-json", "engine-parse", "msgspec"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
