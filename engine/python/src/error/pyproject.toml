[project]
name = "engine-error"
description = "The floor: one closed code set and one Fault every layer raises"
dynamic = ["version", "requires-python", "license"]
dependencies = []

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
