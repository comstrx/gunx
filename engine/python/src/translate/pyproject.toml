[project]
name = "engine-translate"
description = "Messages in every locale: catalogs, plurals, parameters and the reasons"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-context", "engine-error", "engine-json", "engine-parse"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
