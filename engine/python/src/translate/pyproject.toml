[project]
name = "engine-translate"
description = "Messages in every locale: catalogs, plurals, parameters and the reasons"
dynamic = ["version"]
dependencies = ["engine-context", "engine-error", "engine-json", "engine-parse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
