[project]
name = "engine-queue"
description = "Background jobs: typed tasks, retries, uniqueness, delays, workers, a graveyard"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-broker",
    "engine-cache",
    "engine-context",
    "engine-database",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-rand",
    "engine-thread",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
