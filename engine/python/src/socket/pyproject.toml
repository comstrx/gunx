[project]
name = "engine-socket"
description = "WebSocket channels: bounded frames, presence, rooms, events"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-json", "engine-log", "engine-rand", "engine-validate"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
