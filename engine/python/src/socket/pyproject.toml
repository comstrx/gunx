[project]
name = "engine-socket"
description = "WebSocket channels: bounded frames, presence, rooms, events"
dynamic = ["version"]
dependencies = ["engine-error", "engine-json", "engine-log", "engine-rand", "engine-validate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
