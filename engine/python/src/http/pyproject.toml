[project]
name = "engine-http"
description = "HTTP lifecycle: bootstrap, route, middleware, request, response, socket, docs"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-array",
    "engine-cache",
    "engine-context",
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-exception",
    "engine-health",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-rand",
    "engine-socket",
    "engine-thread",
    "engine-token",
    "engine-translate",
    "engine-validate",
    "multidict",
    "sanic",
    "uvloop; sys_platform != 'win32'",
    "websockets",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
