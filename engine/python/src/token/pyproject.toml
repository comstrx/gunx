[project]
name = "engine-token"
description = "JWT, PASETO and stored opaque tokens through isolated issuers"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "pyseto",
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-rand",
    "engine-string",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
