[project]
name = "engine-view"
description = "Templates rendered through one sandboxed engine, for mail and pages"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-json", "engine-string", "engine-thread", "jinja2"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
