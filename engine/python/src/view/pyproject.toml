[project]
name = "engine-view"
description = "Templates rendered through one sandboxed engine, for mail and pages"
dynamic = ["version"]
dependencies = ["engine-error", "engine-json", "engine-string", "engine-thread", "jinja2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
