[project]
name = "engine-fs"
description = "Files: confined roots, atomic writes, pictures, archives, seals, watching"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-func",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-string",
    "engine-thread",
    "caio",
    "pillow",
    "watchfiles",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
