[project]
name = "engine-fs"
description = "Files: confined roots, atomic writes, pictures, archives, seals, watching"
dynamic = ["version"]
dependencies = [
    "engine-crypto",
    "engine-date",
    "engine-error",
    "engine-func",
    "engine-json",
    "engine-log",
    "engine-parse",
    "engine-string",
    "engine-thread",
    "caio",
    "pillow",
    "watchfiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
