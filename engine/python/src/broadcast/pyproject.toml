[project]
name = "engine-broadcast"
description = "Fan-out of events to sockets across workers through Redis"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-cache",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-socket",
    "engine-thread",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
