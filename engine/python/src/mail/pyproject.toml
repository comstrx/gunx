[project]
name = "engine-mail"
description = "Mail: one Message, adapters for log, SMTP and HTTP providers, templates"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-error",
    "engine-log",
    "engine-net",
    "engine-rand",
    "engine-string",
    "engine-validate",
    "engine-view",
    "aiosmtplib",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
