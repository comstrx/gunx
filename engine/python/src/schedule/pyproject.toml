[project]
name = "engine-schedule"
description = "Cron schedules: a parser, a ticker, overlap guards, a distributed lock per task"
dynamic = ["version"]
dependencies = ["engine-cache", "engine-date", "engine-error", "engine-log", "engine-thread"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
