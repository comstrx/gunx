[project]
name = "engine-schedule"
description = "Cron schedules: a parser, a ticker, overlap guards, a distributed lock per task"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-cache", "engine-date", "engine-error", "engine-log", "engine-thread"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
