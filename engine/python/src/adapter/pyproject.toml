[project]
name = "engine-adapter"
description = "The adapter law: families, names, capabilities, one manager per family"
dynamic = ["version", "requires-python", "license"]
dependencies = ["engine-error", "engine-log", "engine-rand"]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
