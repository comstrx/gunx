[project]
name = "engine-exception"
description = "Every exception mapped to one Fault by type, reported once and throttled"
dynamic = ["version"]
dependencies = ["engine-error", "engine-log"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
