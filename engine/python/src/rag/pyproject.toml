[project]
name = "engine-rag"
description = "Retrieval: chunking, embeddings in a memory or database store, cited search"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-adapter",
    "engine-ai",
    "engine-database",
    "engine-error",
    "engine-log",
    "engine-rand",
    "engine-search",
    "engine-string",
    "engine-validate",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
