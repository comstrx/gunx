[project]
name = "engine-rag"
description = "Retrieval: chunking, embeddings in a memory or database store, cited search"
dynamic = ["version"]
dependencies = [
    "engine-adapter",
    "engine-ai",
    "engine-database",
    "engine-error",
    "engine-log",
    "engine-rand",
    "engine-search",
    "engine-string",
    "engine-validate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
