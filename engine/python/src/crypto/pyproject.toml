[project]
name = "engine-crypto"
description = "Hashing, HMAC, AES-GCM with key rotation, argon2id passwords"
dynamic = ["version"]
dependencies = [
    "engine-error",
    "engine-parse",
    "engine-rand",
    "engine-string",
    "argon2-cffi",
    "blake3",
    "cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
