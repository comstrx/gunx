[project]
name = "engine-crypto"
description = "Authenticated encryption, signatures, streaming hashes and Argon2id"
dynamic = ["version", "requires-python", "license"]
dependencies = [
    "engine-error",
    "engine-parse",
    "engine-rand",
    "engine-string",
    "argon2-cffi",
    "blake3",
    "cryptography",
]

[build-system]
requires = ["hatchling", "tomli-w"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "../../metadata.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../distribution.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
