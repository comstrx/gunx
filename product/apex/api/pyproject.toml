[tool.ruff]
target-version = "py315"
line-length = 120
src = [
    "src/contract/src",
    "src/gateway/src",
    "src/hello/src",
    "src/iam/src",
    "src/notify/src",
    "tests",
    "benches",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",
    "CPY",
    "D",
    "FBT001",
    "FBT002",
    "I",
    "TC",
    "ANN401",
    "E401",
    "E701",
    "N818",
    "PLR0913",
    "PLR2004",
    "S101",
    "SIM105",
    "SIM108",
    "TRY003",
    "EM101",
    "EM102",
    "RET505",
    "PLC0105",
    "PLW2901",
    "TRY300",
    "PERF203",
    "PLR0911",
    "PLR0912",
    "C901",
    "ERA001",
    "FBT003",
    "ARG002",
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "INP001",
    "S105",
    "S106",
    "PT012",
    "PT018",
    "ARG001",
    "ANN001",
    "ANN201",
    "E501",
    "PLR0915",
]
"**/config/app.py" = ["S105"]
"**/bootstrap/**" = ["ARG001"]
"**/benches/**" = ["INP001", "T201", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aiohttp".msg = "the engine wraps it"
"aiokafka".msg = "the engine wraps it"
"aiormq".msg = "the engine wraps it"
"aiosmtplib".msg = "the engine wraps it"
"apsw".msg = "the engine wraps it"
"argon2".msg = "the engine wraps it"
"asyncmy".msg = "the engine wraps it"
"asyncpg".msg = "the engine wraps it"
"av".msg = "the engine wraps it"
"blake3".msg = "the engine wraps it"
"cachebox".msg = "the engine wraps it"
"caio".msg = "the engine wraps it"
"clickhouse_connect".msg = "the engine wraps it"
"cryptography".msg = "the engine wraps it"
"dns".msg = "the engine wraps it"
"hiredis".msg = "the engine wraps it"
"jinja2".msg = "the engine wraps it"
"jwt".msg = "the engine wraps it"
"msgspec".msg = "the engine wraps it"
"obstore".msg = "the engine wraps it"
"orjson".msg = "the engine wraps it"
"PIL".msg = "the engine wraps it"
"pymongo".msg = "the engine wraps it"
"pyroaring".msg = "the engine wraps it"
"rapidfuzz".msg = "the engine wraps it"
"redis".msg = "the engine wraps it"
"sanic".msg = "the engine wraps it"
"stringzilla".msg = "the engine wraps it"
"structlog".msg = "the engine wraps it"
"uvloop".msg = "the engine wraps it"
"websockets".msg = "the engine wraps it"

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src/contract/src:src/gateway/src:src/hello/src:src/iam/src:src/notify/src"
files = [
    "src/contract/src",
    "src/gateway/src",
    "src/hello/src",
    "src/iam/src",
    "src/notify/src",
    "tests",
    "benches",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["stringzilla", "stringzilla.*", "pyroaring", "pyroaring.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--timeout=60", "-p", "no:cacheprovider"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
strict = true
filterwarnings = ["error", "ignore:'return' in a 'finally' block:SyntaxWarning"]
