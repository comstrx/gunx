[project]
name = "api"
version = "0.1.0"
description = "The backend: one workspace of services, one per business domain"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = ["api-contract", "api-gateway", "api-hello", "api-iam", "api-notify"]

[dependency-groups]
dev = [
    "aiohttp",
    "engine-test",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-randomly",
    "pytest-timeout",
    "ruff",
]

[tool.uv]
package = false
constraint-dependencies = [
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-randomly==5.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.4",
]
build-constraint-dependencies = ["hatchling==1.33.0"]

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
api-contract = { workspace = true }
api-gateway = { workspace = true }
api-hello = { workspace = true }
api-iam = { workspace = true }
api-notify = { workspace = true }
engine = { path = "../../../engine/python/src/engine", editable = true }
engine-adapter = { path = "../../../engine/python/src/adapter", editable = true }
engine-ai = { path = "../../../engine/python/src/ai", editable = true }
engine-array = { path = "../../../engine/python/src/array", editable = true }
engine-auth = { path = "../../../engine/python/src/auth", editable = true }
engine-broadcast = { path = "../../../engine/python/src/broadcast", editable = true }
engine-broker = { path = "../../../engine/python/src/broker", editable = true }
engine-cache = { path = "../../../engine/python/src/cache", editable = true }
engine-cli = { path = "../../../engine/python/src/cli", editable = true }
engine-config = { path = "../../../engine/python/src/config", editable = true }
engine-context = { path = "../../../engine/python/src/context", editable = true }
engine-crypto = { path = "../../../engine/python/src/crypto", editable = true }
engine-database = { path = "../../../engine/python/src/database", editable = true }
engine-date = { path = "../../../engine/python/src/date", editable = true }
engine-domain = { path = "../../../engine/python/src/domain", editable = true }
engine-error = { path = "../../../engine/python/src/error", editable = true }
engine-event = { path = "../../../engine/python/src/event", editable = true }
engine-exception = { path = "../../../engine/python/src/exception", editable = true }
engine-fake = { path = "../../../engine/python/src/fake", editable = true }
