engine-func = { path = "../../../engine/python/src/func", editable = true }
engine-gateway = { path = "../../../engine/python/src/gateway", editable = true }
engine-geo = { path = "../../../engine/python/src/geo", editable = true }
engine-health = { path = "../../../engine/python/src/health", editable = true }
engine-http = { path = "../../../engine/python/src/http", editable = true }
engine-json = { path = "../../../engine/python/src/json", editable = true }
engine-log = { path = "../../../engine/python/src/log", editable = true }
engine-mail = { path = "../../../engine/python/src/mail", editable = true }
engine-metric = { path = "../../../engine/python/src/metric", editable = true }
engine-net = { path = "../../../engine/python/src/net", editable = true }
engine-notify = { path = "../../../engine/python/src/notify", editable = true }
engine-number = { path = "../../../engine/python/src/number", editable = true }
engine-parse = { path = "../../../engine/python/src/parse", editable = true }
engine-queue = { path = "../../../engine/python/src/queue", editable = true }
engine-rag = { path = "../../../engine/python/src/rag", editable = true }
engine-rand = { path = "../../../engine/python/src/rand", editable = true }
engine-schedule = { path = "../../../engine/python/src/schedule", editable = true }
