[project]
name = "api-contract"
version = "0.1.0"
description = "The shared vocabulary: services, layers, roles, scopes, reasons, topology"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = ["engine-error"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]
dev-mode-dirs = ["src"]
