[project]
name = "api-iam"
version = "0.1.0"
description = "Identity: accounts, one-time codes, sessions, refresh and revocation"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "api-contract",
    "engine-auth",
    "engine-broker",
    "engine-config",
    "engine-database",
    "engine-date",
    "engine-error",
    "engine-event",
    "engine-http",
    "engine-log",
    "engine-metric",
    "engine-queue",
    "engine-rand",
    "engine-string",
    "engine-token",
    "engine-translate",
    "engine-validate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam"]
dev-mode-dirs = ["src"]
