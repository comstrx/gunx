[project]
name = "api-notify"
version = "0.1.0"
description = "Notifications: devices, notices, pushes; listens to identity facts"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "api-contract",
    "engine-auth",
    "engine-broker",
    "engine-config",
    "engine-database",
    "engine-date",
    "engine-error",
    "engine-event",
    "engine-http",
    "engine-log",
    "engine-metric",
    "engine-notify",
    "engine-queue",
    "engine-translate",
    "engine-validate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notify"]
dev-mode-dirs = ["src"]
